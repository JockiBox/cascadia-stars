<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Stars of Cascadia</title>
<link rel="icon" type="image/svg+xml" href="vite.svg"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}
.shell-nav{
  background:linear-gradient(135deg,#134e4a,#0f766e);
  display:flex;align-items:center;height:52px;padding:0 16px;
  position:fixed;top:0;left:0;right:0;z-index:9999;
  box-shadow:0 2px 12px rgba(0,0,0,0.18);
}
.shell-brand{display:flex;align-items:center;gap:10px;margin-right:auto;cursor:pointer}
.shell-brand svg{width:28px;height:28px}
.shell-brand .brand-text{font-weight:900;font-size:15px;color:white;letter-spacing:0.3px}
.shell-brand .brand-text span{color:#fbbf24}
.shell-tabs{display:flex;gap:4px;align-items:center}
.shell-tab{
  padding:7px 16px;border-radius:10px;font-size:13px;font-weight:700;
  color:rgba(255,255,255,0.7);cursor:pointer;transition:all 0.2s;
  border:none;background:none;outline:none;
}
.shell-tab:hover{background:rgba(255,255,255,0.1);color:white}
.shell-tab.active{background:rgba(255,255,255,0.18);color:white}
.shell-tab-icon{display:none}
.logout-btn{
  padding:7px 14px;border-radius:10px;font-size:13px;font-weight:700;
  color:rgba(255,255,255,0.7);cursor:pointer;transition:all 0.2s;
  border:1px solid rgba(255,255,255,0.25);background:none;outline:none;
  margin-left:8px;display:inline-flex;align-items:center;gap:5px;
}
.logout-btn:hover{background:rgba(255,255,255,0.15);color:white;border-color:rgba(255,255,255,0.5)}
@media(max-width:480px){
  .shell-tab .tab-label{display:none}
  .shell-tab-icon{display:inline}
  .shell-tab{padding:8px 12px;font-size:16px}
  .logout-btn{padding:8px 10px;font-size:12px;margin-left:4px}
  .logout-btn .logout-label{display:none}
}
.frame-container{
  position:fixed;top:52px;left:0;right:0;bottom:0;
}
.frame-container iframe{
  width:100%;height:100%;border:none;
  position:absolute;top:0;left:0;
  transition:opacity 0.15s ease;
}
.frame-container iframe.hidden{
  opacity:0;pointer-events:none;z-index:0;
}
.frame-container iframe.visible{
  opacity:1;pointer-events:auto;z-index:1;
}
</style>
</head>
<body>
<nav class="shell-nav">
  <div class="shell-brand" onclick="switchTab('directory')">
    <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="16" fill="#14b8a6"/><text x="16" y="21" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="system-ui">&#9733;</text></svg>
    <div class="brand-text">Stars of <span>Cascadia</span></div>
  </div>
  <div class="shell-tabs">
    <button class="shell-tab active" data-tab="directory" onclick="switchTab('directory')">
      <span class="shell-tab-icon">&#128101;</span>
      <span class="tab-label">Directory</span>
    </button>
    <button class="shell-tab" data-tab="map" onclick="switchTab('map')">
      <span class="shell-tab-icon">&#128506;</span>
      <span class="tab-label">Map</span>
    </button>
  </div>
  <button class="logout-btn" id="logoutBtn" onclick="doLogout()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    <span class="logout-label">Sign Out</span>
  </button>
</nav>
<div class="frame-container">
  <iframe id="frame-directory" class="visible" src="app.html"></iframe>
  <iframe id="frame-map" class="hidden" src="about:blank" data-src="map.html"></iframe>
  <iframe id="frame-profile" class="hidden" src="about:blank"></iframe>
</div>
<script>
var currentTab = 'directory';
var mapLoaded = false;

// Check for admin/login session and show logout button
function checkSession(){
  var hasSession = false;
  try {
    // Check all possible session keys
    var keys = ['cf_session','cf_user','cf_admin','cf_token','cascadia_session','stars_session','stars_user'];
    for(var i=0;i<keys.length;i++){
      if(localStorage.getItem(keys[i])){hasSession=true;break;}
    }
    // Also check if sessionStorage has anything
    if(!hasSession){
      for(var i=0;i<keys.length;i++){
        if(sessionStorage.getItem(keys[i])){hasSession=true;break;}
      }
    }
    // Check for any key containing 'admin','session','user','token','auth'
    if(!hasSession){
      for(var j=0;j<localStorage.length;j++){
        var k=localStorage.key(j).toLowerCase();
        if(k.indexOf('admin')>-1||k.indexOf('session')>-1||k.indexOf('user')>-1||k.indexOf('token')>-1||k.indexOf('auth')>-1||k.indexOf('login')>-1){
          hasSession=true;break;
        }
      }
    }
  }catch(e){}
  var btn=document.getElementById('logoutBtn');
  if(hasSession) btn.classList.add('visible');
  else btn.classList.remove('visible');
}

function doLogout(){
  try{
    localStorage.clear();
    sessionStorage.clear();
  }catch(e){}
  // Clear cookies
  document.cookie.split(';').forEach(function(c){
    document.cookie=c.replace(/^ +/,'').replace(/=.*/,'=;expires='+new Date().toUTCString()+';path=/');
  });
  window.location.href=window.location.origin+window.location.pathname;
}

// Run session check on load and periodically
checkSession();
setInterval(checkSession,3000);

// Also listen for storage events from child iframes
window.addEventListener('message',function(e){
  if(e.data&&e.data.type==='sessionChanged') checkSession();
});

function switchTab(tab, opts) {
  opts = opts || {};
  currentTab = tab;

  // Update tab buttons
  document.querySelectorAll('.shell-tab').forEach(function(btn){
    btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
  });

  // Handle frame visibility
  ['directory','map','profile'].forEach(function(t){
    var frame = document.getElementById('frame-' + t);
    if(t === tab){
      frame.classList.remove('hidden');
      frame.classList.add('visible');
    } else {
      frame.classList.add('hidden');
      frame.classList.remove('visible');
    }
  });

  // Lazy-load map on first visit
  if(tab === 'map' && !mapLoaded){
    var mapFrame = document.getElementById('frame-map');
    mapFrame.src = mapFrame.getAttribute('data-src');
    mapLoaded = true;
  }

  // Load profile if switching to profile tab
  if(tab === 'profile' && opts.profileId){
    var profileFrame = document.getElementById('frame-profile');
    if(profileFrame.src === 'about:blank' || !profileFrame.contentWindow){
      profileFrame.src = '/profile.html?id=' + opts.profileId;
    } else {
      profileFrame.contentWindow.postMessage({type:'loadProfile', id: opts.profileId}, '*');
    }
  }
}

// Listen for messages from child frames
window.addEventListener('message', function(e){
  if(!e.data || !e.data.type) return;

  if(e.data.type === 'openProfile' && e.data.id){
    // Load profile frame and switch to it
    var profileFrame = document.getElementById('frame-profile');
    profileFrame.src = '/profile.html?id=' + e.data.id;
    switchTab('profile', {profileId: e.data.id});
  }

  if(e.data.type === 'backToMap'){
    switchTab('map');
  }

  if(e.data.type === 'backToDirectory'){
    switchTab('directory');
  }
});
</script>
</body>
</html>
