<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cascadia Healthcare - Our Facilities</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;background:#f0f5f3;color:#2d3748;overflow:hidden}
.header{
  background:linear-gradient(135deg,#43b692 0%,#2d9a7e 40%,#1f7a6a 100%);
  padding:0 28px;height:72px;
  display:flex;align-items:center;justify-content:space-between;
  position:relative;z-index:1000;
  box-shadow:0 4px 20px rgba(45,154,126,0.3);
}
.header::after{
  content:'';position:absolute;bottom:-12px;left:0;right:0;height:14px;
  background:url("data:image/svg+xml,%3Csvg viewBox='0 0 1200 14' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0c200 14 400 14 600 0s400-14 600 0v14H0z' fill='%23f0f5f3'/%3E%3C/svg%3E") repeat-x;
  background-size:600px 14px;z-index:10;
}
.header-left{display:flex;align-items:center;gap:14px}
.logo-mark{
  width:44px;height:44px;border-radius:14px;background:white;
  display:flex;align-items:center;justify-content:center;font-size:24px;
  box-shadow:0 3px 10px rgba(0,0,0,0.15);transform:rotate(-3deg);
}
.header-title{font-size:18px;font-weight:900;color:white;letter-spacing:0.5px}
.header-title span{color:#ffe082}
.header-sub{font-size:12px;color:rgba(255,255,255,0.75);font-weight:600;margin-top:1px}
.header-stats{display:flex;gap:20px}
.stat{text-align:center;background:rgba(255,255,255,0.18);border-radius:14px;padding:6px 18px;backdrop-filter:blur(4px)}
.stat-value{font-size:24px;font-weight:900;color:white}
.stat-label{font-size:9px;color:rgba(255,255,255,0.8);text-transform:uppercase;letter-spacing:1.5px;font-weight:700}
.layout{display:flex;height:calc(100vh - 72px)}
.sidebar{width:370px;background:white;border-right:2px solid #e8efe9;display:flex;flex-direction:column;overflow:hidden;padding-top:16px}
.sidebar-header{padding:4px 20px 16px;flex-shrink:0}
.search-wrap{position:relative}
.search-box{width:100%;padding:12px 16px 12px 44px;background:#f0f5f3;border:2px solid #d6e4dc;border-radius:16px;font-size:14px;color:#2d3748;outline:none;transition:all 0.3s;font-family:'Nunito',sans-serif;font-weight:600}
.search-box::placeholder{color:#8fa89e;font-weight:600}
.search-box:focus{border-color:#43b692;background:white;box-shadow:0 0 0 4px rgba(67,182,146,0.15)}
.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#8fa89e;font-size:18px}
.filters{padding:0 20px 12px;flex-shrink:0}
.filter-section{margin-bottom:10px}
.filter-label{font-size:10px;color:#8fa89e;font-weight:800;text-transform:uppercase;letter-spacing:2px;margin-bottom:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:6px}
.filter-btn{padding:6px 14px;border-radius:24px;border:2px solid #e8efe9;background:white;font-size:12px;color:#5a7568;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px;font-family:'Nunito',sans-serif;font-weight:700}
.filter-btn:hover{border-color:#43b692;background:#f0faf5;transform:translateY(-1px)}
.filter-btn.active{background:linear-gradient(135deg,#43b692,#2d9a7e);border-color:transparent;color:white;box-shadow:0 3px 10px rgba(67,182,146,0.3);transform:translateY(-1px)}
.filter-dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:2px solid rgba(255,255,255,0.4)}
.filter-count{opacity:0.6;font-size:11px}
.count-badge{font-size:12px;color:#8fa89e;padding:10px 20px;border-top:2px solid #f0f5f3;border-bottom:2px solid #f0f5f3;font-weight:700;display:flex;align-items:center;justify-content:space-between;background:#fafcfb}
.count-num{color:#43b692;font-weight:900;font-size:14px}
.facility-list{overflow-y:auto;flex:1;padding:6px 0}
.facility-list::-webkit-scrollbar{width:6px}
.facility-list::-webkit-scrollbar-track{background:transparent}
.facility-list::-webkit-scrollbar-thumb{background:#d6e4dc;border-radius:6px}
.facility-item{padding:12px 20px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:12px;border-left:4px solid transparent;margin:2px 0;border-radius:0 12px 12px 0;margin-right:8px}
.facility-item:hover{background:#f0faf5;transform:translateX(2px)}
.facility-item.active{background:linear-gradient(90deg,#e6f7f0,#f0faf5);border-left-color:#43b692;box-shadow:0 2px 8px rgba(67,182,146,0.1)}
.facility-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.15)}
.facility-info{flex:1;min-width:0}
.facility-name{font-size:13px;font-weight:800;color:#2d3748;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.facility-meta{font-size:11px;color:#8fa89e;margin-top:2px;font-weight:600}
.facility-type{font-size:9px;padding:4px 10px;border-radius:10px;background:#f0f5f3;color:#5a7568;flex-shrink:0;font-weight:800;text-transform:uppercase;letter-spacing:0.5px}
.facility-staff-count{font-size:10px;color:#43b692;font-weight:800;flex-shrink:0}
.map-container{flex:1;position:relative;background:#f0f5f3}
#map{width:100%;height:100%}
.leaflet-control-zoom a{background:white!important;color:#43b692!important;border-color:#e8efe9!important;font-weight:800!important;border-radius:10px!important}
.leaflet-control-zoom a:hover{background:#f0faf5!important}
.leaflet-control-zoom{border-radius:12px!important;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,0.1)!important;border:none!important}
.leaflet-control-attribution{background:rgba(255,255,255,0.85)!important;color:#8fa89e!important;font-size:10px!important;border-radius:8px 0 0 0!important}
.leaflet-control-attribution a{color:#43b692!important}
.leaflet-tooltip{background:white!important;color:#2d3748!important;border:2px solid #e8efe9!important;border-radius:14px!important;padding:10px 14px!important;box-shadow:0 6px 24px rgba(0,0,0,0.12)!important;font-size:13px!important;font-family:'Nunito',sans-serif!important;font-weight:700!important}
.leaflet-tooltip::before{border-top-color:white!important}
.marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{background:none!important}
.marker-cluster-small div{background:linear-gradient(135deg,#43b692,#5cc8a4)!important;color:white!important;font-weight:900!important;font-size:13px!important;width:38px!important;height:38px!important;margin:1px!important;border-radius:50%!important;display:flex!important;align-items:center!important;justify-content:center!important;box-shadow:0 3px 12px rgba(67,182,146,0.4),inset 0 -2px 0 rgba(0,0,0,0.1)!important;font-family:'Nunito',sans-serif!important}
.marker-cluster-medium div{background:linear-gradient(135deg,#f5a623,#f7c948)!important;color:white!important;font-weight:900!important;font-size:14px!important;width:46px!important;height:46px!important;margin:2px!important;border-radius:50%!important;display:flex!important;align-items:center!important;justify-content:center!important;box-shadow:0 3px 14px rgba(245,166,35,0.4),inset 0 -2px 0 rgba(0,0,0,0.1)!important;font-family:'Nunito',sans-serif!important}
.marker-cluster-large div{background:linear-gradient(135deg,#e85d75,#f07d8f)!important;color:white!important;font-weight:900!important;font-size:15px!important;width:54px!important;height:54px!important;margin:3px!important;border-radius:50%!important;display:flex!important;align-items:center!important;justify-content:center!important;box-shadow:0 3px 16px rgba(232,93,117,0.4),inset 0 -2px 0 rgba(0,0,0,0.1)!important;font-family:'Nunito',sans-serif!important}

/* --- Staff detail card --- */
.facility-card{
  position:absolute;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px) scale(0.95);
  background:white;border:2px solid #e8efe9;border-radius:20px;
  box-shadow:0 10px 40px rgba(0,0,0,0.12);
  padding:20px 24px;z-index:800;
  min-width:340px;max-width:460px;
  opacity:0;pointer-events:none;
  transition:all 0.35s cubic-bezier(0.34,1.56,0.64,1);
  max-height:55vh;display:flex;flex-direction:column;
}
.facility-card.visible{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0) scale(1)}
.card-header{display:flex;justify-content:space-between;align-items:start;gap:12px;flex-shrink:0}
.card-name{font-size:17px;font-weight:900;color:#2d3748;line-height:1.3}
.card-close{cursor:pointer;color:#8fa89e;font-size:22px;padding:2px 8px;border-radius:10px;transition:all 0.2s;flex-shrink:0;font-weight:900}
.card-close:hover{color:#e85d75;background:#fef2f4}
.card-meta{font-size:13px;color:#8fa89e;margin-top:4px;font-weight:700;flex-shrink:0}
.card-badges{display:flex;gap:8px;margin-top:10px;flex-shrink:0;flex-wrap:wrap}
.card-badge{font-size:11px;padding:5px 14px;border-radius:12px;font-weight:800;border:2px solid}

/* Staff section */
.staff-section{margin-top:14px;flex-shrink:0}
.staff-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.staff-title{font-size:12px;font-weight:800;color:#43b692;text-transform:uppercase;letter-spacing:1px}
.staff-count-badge{font-size:11px;background:#e6f7f0;color:#2d9a7e;padding:3px 10px;border-radius:10px;font-weight:800}
.staff-list{overflow-y:auto;max-height:25vh;display:flex;flex-direction:column;gap:6px}
.staff-list::-webkit-scrollbar{width:4px}
.staff-list::-webkit-scrollbar-thumb{background:#d6e4dc;border-radius:4px}
.staff-person{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;transition:background 0.15s}
a.staff-person:hover{background:#e0f5ec;transform:translateX(2px)}
.staff-person:hover{background:#f0faf5}
.staff-avatar{
  width:36px;height:36px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:900;color:white;flex-shrink:0;
  box-shadow:0 2px 6px rgba(0,0,0,0.12);
}
.staff-details{flex:1;min-width:0}
.staff-name{font-size:13px;font-weight:800;color:#2d3748}
.staff-role{font-size:11px;color:#8fa89e;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.no-staff{text-align:center;padding:16px;color:#b8ccc3;font-size:13px;font-weight:700;font-style:italic}

@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media(max-width:768px){
  .layout{flex-direction:column}
  .sidebar{width:100%;height:35vh;border-right:none;border-bottom:2px solid #e8efe9;padding-top:12px}
  .map-container{height:65vh}
  .header-stats{display:none}
  .header{height:60px}
  .facility-card{min-width:unset;left:16px;right:16px;transform:translateY(20px) scale(0.95);bottom:16px;max-height:50vh}
  .facility-card.visible{transform:translateY(0) scale(1)}
}
</style>
</head>

const SC={ID:'#43b692',OR:'#f5a623',WA:'#4a9ff5',MT:'#a77bca',AZ:'#f07d5e',CA:'#e85d97'};
const SN={ID:'Idaho',OR:'Oregon',WA:'Washington',MT:'Montana',AZ:'Arizona',CA:'California'};

const TI={snf:'<svg width="14" height="14" viewBox="0 0 24 24" fill="white" stroke="none"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 11h-4v4h-4v-4H6v-4h4V6h4v4h4v4z"/></svg>',alf:'<svg width="14" height="14" viewBox="0 0 24 24" fill="white" stroke="none"><path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"/></svg>',ilf:'<svg width="14" height="14" viewBox="0 0 24 24" fill="white" stroke="none"><path d="M17 11V3H7v4H3v14h8v-4h2v4h8V11h-4zM7 19H5v-2h2v2zm0-4H5v-2h2v2zm0-4H5V9h2v2zm4 4H9v-2h2v2zm0-4H9V9h2v2zm0-4H9V5h2v2zm4 8h-2v-2h2v2zm0-4h-2V9h2v2zm0-4h-2V5h2v2zm4 12h-2v-2h2v2zm0-4h-2v-2h2v2z"/></svg>',hospice:'<svg width="14" height="14" viewBox="0 0 24 24" fill="white" stroke="none"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>',corporate:'<svg width="14" height="14" viewBox="0 0 24 24" fill="white" stroke="none"><path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/></svg>',healthcare:'<svg width="14" height="14" viewBox="0 0 24 24" fill="white" stroke="none"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 11h-4v4h-4v-4H6v-4h4V6h4v4h4v4z"/></svg>'};
let map,markers,activeMarker=null,selectedState=null,selectedType=null,searchQuery='';

// Count total people
let totalPeople=0;
Object.values(staffByFacility).forEach(arr=>{totalPeople+=arr.length});

map=L.map('map',{zoomControl:true}).setView([44.5,-117.0],6);
L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',{attribution:'OpenStreetMap, HOT',maxZoom:19}).addTo(map);
markers=L.markerClusterGroup({maxClusterRadius:45,spiderfyOnMaxZoom:true,showCoverageOnHover:false,
  iconCreateFunction:function(c){var n=c.getChildCount(),cls=n>10?'large':n>5?'medium':'small';
  return L.divIcon({html:'<div>'+n+'</div>',className:'marker-cluster marker-cluster-'+cls,iconSize:L.point(n>10?60:n>5?50:40,n>10?60:n>5?50:40)})}
});

var states=[...new Set(facilities.map(f=>f.state))];
document.getElementById('totalCount').textContent=facilities.length;
document.getElementById('stateCount').textContent=states.length;
document.getElementById('peopleCount').textContent=totalPeople;

// Get staff count for a facility
function getStaff(fname){return staffByFacility[fname]||[]}

// Build filters
var stateCounts={};facilities.forEach(f=>{stateCounts[f.state]=(stateCounts[f.state]||0)+1});
var sf=document.getElementById('stateFilters');
Object.entries(stateCounts).sort((a,b)=>b[1]-a[1]).forEach(([st,ct])=>{
  var b=document.createElement('button');b.className='filter-btn';b.dataset.state=st;
  b.innerHTML='<span class="filter-dot" style="background:'+SC[st]+'"></span>'+SN[st]+' <span class="filter-count">'+ct+'</span>';
  b.onclick=()=>{selectedState=selectedState===st?null:st;document.querySelectorAll('#stateFilters .filter-btn').forEach(x=>x.classList.toggle('active',x.dataset.state===selectedState));render()};
  sf.appendChild(b)});
var typeCounts={};facilities.forEach(f=>{typeCounts[f.type]=(typeCounts[f.type]||0)+1});
var tf=document.getElementById('typeFilters');
Object.entries(typeCounts).sort((a,b)=>b[1]-a[1]).forEach(([tp,ct])=>{
  var b=document.createElement('button');b.className='filter-btn';b.dataset.type=tp;
  b.innerHTML='<span style="display:inline-flex;align-items:center">'+TI[tp]+'</span> '+TL[tp]+' <span class="filter-count">'+ct+'</span>';
  b.onclick=()=>{selectedType=selectedType===tp?null:tp;document.querySelectorAll('#typeFilters .filter-btn').forEach(x=>x.classList.toggle('active',x.dataset.type===selectedType));render()};
  tf.appendChild(b)});

document.getElementById('searchInput').addEventListener('input',function(e){searchQuery=e.target.value.toLowerCase();render()});

function getFiltered(){return facilities.filter(f=>{
  if(selectedState&&f.state!==selectedState)return false;
  if(selectedType&&f.type!==selectedType)return false;
  if(searchQuery){
    // Search facilities AND people
    var q=searchQuery;
    if(f.name.toLowerCase().includes(q)||f.city.toLowerCase().includes(q))return true;
    var staff=getStaff(f.name);
    return staff.some(s=>s.n.toLowerCase().includes(q)||s.r.toLowerCase().includes(q));
  }
  return true})}

function render(){
  var filtered=getFiltered();
  document.getElementById('filteredNum').textContent=filtered.length;
  var fl=document.getElementById('filterLabel');
  fl.textContent=selectedState?SN[selectedState]:(selectedType?TL[selectedType]:'');

  var list=document.getElementById('facilityList');list.innerHTML='';
  filtered.forEach(f=>{
    var staff=getStaff(f.name);
    var d=document.createElement('div');
    d.className='facility-item'+(activeMarker===f.name?' active':'');
    var staffBadge=staff.length>0?'<span class="facility-staff-count">'+staff.length+' people</span>':'';
    d.innerHTML='<div class="facility-dot" style="background:'+SC[f.state]+'"></div><div class="facility-info"><div class="facility-name">'+f.name+'</div><div class="facility-meta">'+f.city+', '+f.state+'</div></div>'+staffBadge;
    d.onclick=()=>selectFacility(f);
    list.appendChild(d)});

  markers.clearLayers();
  filtered.forEach(f=>{
    var color=SC[f.state]||'#999';
    var isActive=activeMarker===f.name;
    var staff=getStaff(f.name);
    var badge=staff.length>0?'<div style="position:absolute;top:-4px;right:-4px;background:#e85d75;color:white;border-radius:50%;width:16px;height:16px;font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid white;font-family:Nunito,sans-serif">'+staff.length+'</div>':'';
    var icon=L.divIcon({
      className:'',
      html:'<div style="position:relative;width:'+(isActive?44:32)+'px;height:'+(isActive?44:32)+'px;background:'+color+';border-radius:50%;border:3px solid white;box-shadow:0 3px 10px '+color+'66;display:flex;align-items:center;justify-content:center;font-size:'+(isActive?18:14)+'px;transition:all 0.3s;'+(isActive?'animation:bounce 0.6s infinite;':'')+'">'+TI[f.type]+badge+'</div>',
      iconSize:[isActive?44:32,isActive?44:32],
      iconAnchor:[(isActive?22:16),(isActive?22:16)]
    });
    var m=L.marker([f.lat,f.lng],{icon:icon});
    var staffPreview=staff.length>0?'<br><span style="font-size:11px;color:#43b692;font-weight:700">'+staff.length+' team member'+(staff.length>1?'s':'')+'</span>':'';
    var addrPreview=f.addr?'<br><span style="font-size:10px;color:#5a9e8f;font-weight:600">'+f.addr+'</span>':'';
    var tip='<div style="text-align:center"><strong style="color:'+color+'">'+f.name+'</strong><br><span style="color:#8fa89e">'+f.city+', '+f.state+'</span>'+addrPreview+staffPreview+'</div>';
    m.bindTooltip(tip,{direction:'top',offset:[0,-20]});
    m.on('click',()=>selectFacility(f));
    markers.addLayer(m)});
  map.addLayer(markers);
  if(filtered.length>0&&(selectedState||selectedType||searchQuery)){
    map.fitBounds(L.latLngBounds(filtered.map(f=>[f.lat,f.lng])),{padding:[50,50],maxZoom:10})}
}

function selectFacility(f){
  activeMarker=activeMarker===f.name?null:f.name;
  var card=document.getElementById('facilityCard');
  if(activeMarker){
    document.getElementById('cardName').innerHTML=TI[f.type]+' '+f.name;
    document.getElementById('cardMeta').innerHTML=f.city+', '+(SN[f.state]||f.state)+(f.addr?'<br><a href="https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(f.addr)+'" target="_blank" rel="noopener" style="color:#2d9a7e;text-decoration:none;font-size:12px;display:inline-flex;align-items:center;gap:4px;margin-top:4px;font-weight:700" onmouseover="this.style.textDecoration=\'underline\'" onmouseout="this.style.textDecoration=\'none\'"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>'+f.addr+'</a>':'');
    var sc=SC[f.state],tc=TC[f.type];
    document.getElementById('cardBadges').innerHTML=
      '<span class="card-badge" style="background:'+sc+'18;color:'+sc+';border-color:'+sc+'40">'+SN[f.state]+'</span>'+
      '<span class="card-badge" style="background:'+tc+'18;color:'+tc+';border-color:'+tc+'40">'+TL[f.type]+'</span>';

    // Staff roster
    var staff=getStaff(f.name);
    var staffCountEl=document.getElementById('staffCount');
    var staffListEl=document.getElementById('staffList');
    if(staff.length>0){
      staffCountEl.textContent=staff.length+' member'+(staff.length>1?'s':'');
      staffListEl.innerHTML=staff.map(function(s){
        var tag=s.id?'a':'div';
        var href=s.id?' href="profile.html?id='+'" ':'';
        if(s.id){
          return '<a href="profile.html?id='+s.id+'" class="staff-person" style="text-decoration:none;color:inherit;cursor:pointer">'+
            '<div class="staff-avatar" style="background:'+s.c+'">'+s.i+'</div>'+
            '<div class="staff-details">'+
            '<div class="staff-name">'+s.n+'</div>'+
            '<div class="staff-role">'+s.r+'</div>'+
            '</div></a>'
        }
        return '<div class="staff-person">'+
          '<div class="staff-avatar" style="background:'+s.c+'">'+s.i+'</div>'+
          '<div class="staff-details">'+
          '<div class="staff-name">'+s.n+'</div>'+
          '<div class="staff-role">'+s.r+'</div>'+
          '</div></div>'
      }).join('');
    } else {
      staffCountEl.textContent='No profiles yet';
      staffListEl.innerHTML='<div class="no-staff">No team members linked to this facility yet</div>';
    }
    card.classList.add('visible');
    map.flyTo([f.lat,f.lng],Math.max(map.getZoom(),10),{duration:0.8})
  } else {
    card.classList.remove('visible')
  }
  render()
}

document.getElementById('cardClose').onclick=()=>{
  activeMarker=null;
  document.getElementById('facilityCard').classList.remove('visible');
  render()};
render();
</script>
