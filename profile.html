<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Profile - The Stars of Cascadia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',system-ui,sans-serif;background:#f0faf5;min-height:100vh}
.top-bar{background:linear-gradient(135deg,#134e4a,#0f766e);padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,0.15)}
.top-bar a{color:#a7f3d0;text-decoration:none;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;transition:color 0.2s}
.top-bar a:hover{color:white}
.top-bar .brand{color:white;font-weight:900;font-size:16px;margin-left:auto}
.top-bar .brand span{color:#fbbf24}
.back-arrow{width:20px;height:20px}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px}
.spinner{width:48px;height:48px;border:4px solid #d1fae5;border-top-color:#0d9488;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:#6b7280;font-weight:700;font-size:15px}
.error-state{text-align:center;padding:80px 20px;color:#ef4444;font-weight:700;font-size:18px}
.profile-container{max-width:640px;margin:0 auto;padding:24px 16px 60px}
.profile-card{background:white;border-radius:24px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.08)}
.profile-header{position:relative;padding:32px 24px 24px;text-align:center;background:linear-gradient(135deg,#134e4a,#0f766e)}
.profile-photo{width:140px;height:140px;border-radius:50%;object-fit:cover;border:5px solid white;box-shadow:0 4px 20px rgba(0,0,0,0.2);margin-bottom:16px}
.profile-initials{width:140px;height:140px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:900;color:white;border:5px solid white;box-shadow:0 4px 20px rgba(0,0,0,0.2);margin:0 auto 16px}
.profile-name{font-size:28px;font-weight:900;color:white;letter-spacing:-0.5px}
.profile-role{font-size:15px;font-weight:700;color:#a7f3d0;margin-top:4px}
.profile-facility{font-size:13px;font-weight:600;color:#6ee7b7;margin-top:2px;opacity:0.9}
.profile-body{padding:24px}
.section{margin-bottom:24px}
.section:last-child{margin-bottom:0}
.section-title{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1.5px;color:#0d9488;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:#e5e7eb}
.bio-text{font-size:15px;line-height:1.7;color:#374151;font-weight:600}
.tag-list{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700}
.tag-like{background:#ecfdf5;color:#059669}
.tag-dislike{background:#fef2f2;color:#dc2626}
.contact-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f3f4f6}
.contact-row:last-child{border-bottom:none}
.contact-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.contact-icon.email-icon{background:#ede9fe;color:#7c3aed}
.contact-icon.phone-icon{background:#dbeafe;color:#2563eb}
.contact-icon.facility-icon{background:#fef3c7;color:#d97706}
.contact-label{font-size:11px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:0.5px}
.contact-value{font-size:14px;font-weight:700;color:#374151}
.contact-value a{color:#0d9488;text-decoration:none}
.contact-value a:hover{text-decoration:underline}
.empty-section{color:#9ca3af;font-style:italic;font-size:14px;font-weight:600}
</style>
</head>
<body>
<div class="top-bar">
  <a href="map.html" id="backLink"><svg class="back-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>Back to Map</a>
  <div class="brand">Stars of <span>Cascadia</span></div>
</div>
<div id="app">
  <div class="loading"><div class="spinner"></div><div class="loading-text">Loading profile...</div></div>
</div>
<script>
const SUPABASE_URL='https://oilrqcuyqjfxqbbvwopi.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pbHJxY3V5cWpmeHFiYnZ3b3BpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg1MjIwMjIsImV4cCI6MjA4NDA5ODAyMn0.eTdOsZ1lkeJo7TcYSyC4CdrX0sXm8kvVEtigg40tENw';

function getIdFromUrl(){
  var p=new URLSearchParams(window.location.search);
  return p.get('id')||null;
}

function esc(s){
  if(!s)return '';
  var d=document.createElement('div');d.textContent=s;return d.innerHTML;
}

async function loadProfile(overrideId){
  var id=overrideId||getIdFromUrl();
  if(!id){document.getElementById('app').innerHTML='<div class="error-state">No profile ID provided</div>';return;}
  try{
    var r=await fetch(SUPABASE_URL+'/rest/v1/cf_employees?id=eq.'+encodeURIComponent(id)+'&select=*',{
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
    });
    var data=await r.json();
    if(!data||!data.length){document.getElementById('app').innerHTML='<div class="error-state">Profile not found</div>';return;}
    render(data[0]);
  }catch(e){
    document.getElementById('app').innerHTML='<div class="error-state">Error loading profile</div>';
  }
}

function render(p){
  var photoHTML='';
  if(p.photo&&p.photo.length>100){
    photoHTML='<img class="profile-photo" src="'+p.photo+'" alt="'+esc(p.name)+'"/>';
  }else{
    var ini=p.initials||((p.name||'').split(' ').map(function(w){return w[0]}).join('').substring(0,2).toUpperCase());
    var col=p.color||'#0d9488';
    photoHTML='<div class="profile-initials" style="background:'+col+'">'+esc(ini)+'</div>';
  }

  var likesHTML='';
  if(p.likes&&p.likes.length){
    likesHTML='<div class="section"><div class="section-title">Likes</div><div class="tag-list">';
    p.likes.forEach(function(l){likesHTML+='<span class="tag tag-like">'+esc(l)+'</span>';});
    likesHTML+='</div></div>';
  }

  var dislikesHTML='';
  if(p.dislikes&&p.dislikes.length){
    dislikesHTML='<div class="section"><div class="section-title">Dislikes</div><div class="tag-list">';
    p.dislikes.forEach(function(d){dislikesHTML+='<span class="tag tag-dislike">'+esc(d)+'</span>';});
    dislikesHTML+='</div></div>';
  }

  var bioHTML='';
  if(p.bio){
    bioHTML='<div class="section"><div class="section-title">About</div><div class="bio-text">'+esc(p.bio)+'</div></div>';
  }

  var contactHTML='<div class="section"><div class="section-title">Details</div>';
  if(p.facility){
    contactHTML+='<div class="contact-row"><div class="contact-icon facility-icon">&#127970;</div><div><div class="contact-label">Facility</div><div class="contact-value">'+esc(p.facility)+'</div></div></div>';
  }
  if(p.email){
    contactHTML+='<div class="contact-row"><div class="contact-icon email-icon">&#9993;</div><div><div class="contact-label">Email</div><div class="contact-value"><a href="mailto:'+esc(p.email)+'">'+esc(p.email)+'</a></div></div></div>';
  }
  if(p.phone){
    contactHTML+='<div class="contact-row"><div class="contact-icon phone-icon">&#9742;</div><div><div class="contact-label">Phone</div><div class="contact-value"><a href="tel:'+esc(p.phone)+'">'+esc(p.phone)+'</a></div></div></div>';
  }
  contactHTML+='</div>';

  document.title=esc(p.name)+' - Stars of Cascadia';
  document.getElementById('app').innerHTML=
    '<div class="profile-container"><div class="profile-card">'+
    '<div class="profile-header">'+photoHTML+
    '<div class="profile-name">'+esc(p.name)+'</div>'+
    (p.role?'<div class="profile-role">'+esc(p.role)+'</div>':'')+
    (p.facility?'<div class="profile-facility">'+esc(p.facility)+'</div>':'')+
    '</div>'+
    '<div class="profile-body">'+bioHTML+likesHTML+dislikesHTML+contactHTML+'</div>'+
    '</div></div>';
}

// Handle being in iframe
var inIframe = (window !== window.parent);

// Back button sends message to parent if in iframe
document.getElementById('backLink').addEventListener('click', function(e){
  if(inIframe){
    e.preventDefault();
    window.parent.postMessage({type:'backToMap'},'*');
  }
});

// Listen for profile load requests from parent
window.addEventListener('message', function(e){
  if(e.data && e.data.type === 'loadProfile' && e.data.id){
    // Update URL param without reload and fetch profile
    history.replaceState(null, '', '/profile.html?id=' + e.data.id);
    document.getElementById('app').innerHTML = '<div class="loading"><div class="spinner"></div><div class="loading-text">Loading profile...</div></div>';
    loadProfile(e.data.id);
  }
});

// Hide top bar if in iframe (parent has its own nav)
if(inIframe){
  document.querySelector('.top-bar').style.display='none';
  document.querySelector('.profile-container').style.paddingTop='12px';
}

loadProfile();
</script>
</body>
</html>
